name: Build global Earth geoid
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_earth_global.py'
      - '.github/workflows/build-earth-global.yml'
permissions:
  contents: write
concurrency:
  group: build-earth-global
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific readers
        run: python -m pip install 'numpy==1.26.4' 'rasterio==1.4.3'
      - name: Validate source and create the global display grid
        run: python scripts/build_earth_global.py
      - name: Commit only the new global public dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/earth-global/
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified global EGM2008 nodes, provenance and numeric checks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Retain exact site snapshot for integration checks
        uses: actions/upload-artifact@v4
        with:
          name: global-earth-source-snapshot
          path: |
            *.html
            *.js
            *.css
            *.md
            data/
            tests/
            scripts/
          retention-days: 7
