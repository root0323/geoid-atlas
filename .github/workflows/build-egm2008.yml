name: Build EGM2008 comparison data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_egm2008.py'
      - '.github/workflows/build-egm2008.yml'
permissions:
  contents: write
concurrency:
  group: egm2008-data-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster reader
        run: python -m pip install 'rasterio==1.5.1'
      - name: Download public EGM2008 grid and compute four-node interpolation
        run: python scripts/build_egm2008.py
      - name: Save generated EGM2008 data without changing the uploaded observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/egm2008.json data/egm2008-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add computed EGM2008 geoid values and source provenance'
          git pull --rebase origin main
          git push origin HEAD:main
