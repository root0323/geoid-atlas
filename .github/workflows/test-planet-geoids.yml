name: Test planetary reference surfaces
on:
  workflow_dispatch:
  push:
    paths:
      - 'planet-geoid.js'
      - 'planet-geoid.css'
      - 'index.html'
      - 'tests/test_planet_geoids.py'
      - '.github/workflows/test-planet-geoids.yml'
permissions:
  contents: read
concurrency:
  group: planetary-browser-tests
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean rendering fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install browser test client
        run: |
          python -m pip install 'playwright==1.55.0'
          if ! command -v google-chrome >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Validate science, controls, source links, mobile and Earth regressions
        run: python tests/test_planet_geoids.py
      - name: Retain browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planetary-browser-checks
          path: test-results/
          retention-days: 7
