<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d15">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>GEOID ATLAS · 지오이드 탐구</title>
<style>body{margin:0;background:#080d15;color:#eaf2f5;font:15px/1.8 system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{max-width:440px;padding:32px}h1{font-size:21px;letter-spacing:2px}p{color:#9baeba}button{font:inherit;padding:9px 16px;border:1px solid #74e5d0;border-radius:7px;color:#74e5d0;background:transparent;cursor:pointer}</style>
</head>
<body><main role="status"><h1>GEOID ATLAS</h1><p id="loadStatus">탐색 화면과 관측 자료를 불러오는 중입니다.</p><button id="retry" hidden>다시 불러오기</button><noscript>이 탐색기는 JavaScript를 켜야 이용할 수 있습니다.</noscript></main>
<script>
'use strict';
// Keep the uploaded observations and KN18 dataset byte-for-byte.
(async function start(){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);
 try{
  const response=await fetch('./app-v6.html',{signal:controller.signal});
  if(!response.ok)throw new Error('HTTP '+response.status);
  let html=await response.text();
  if(!html.includes('const GEOID_DATA=')||!html.includes('window.GeoidAtlas='))throw new Error('앱 파일 확인 실패');
  html=html.replace('</head>','<meta name="referrer" content="strict-origin-when-cross-origin"><link rel="stylesheet" href="./map-view.css?v=1"><link rel="stylesheet" href="./model-controls.css?v=1"></head>');
  html=html.replace('</body>','<script src="./map-view.js?v=2"><\/script><script src="./model-controls.js?v=1"><\/script></body>');
  clearTimeout(timeout);document.open();document.write(html);document.close();
 }catch(error){
  clearTimeout(timeout);document.getElementById('loadStatus').textContent='화면을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.';
  const retry=document.getElementById('retry');retry.hidden=false;retry.onclick=()=>location.reload();console.error('Geoid Atlas startup:',error);
 }
})();
</script></body></html>
